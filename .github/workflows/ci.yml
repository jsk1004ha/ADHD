name: Tests and packaged installation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install document test dependencies
        run: python -m pip install -r requirements-documents.txt
      - name: Regression suite
        run: python -m unittest discover -s tests -q
      - name: Installation audit regressions
        run: python -m unittest scripts.test_audit_local_install -q
      - name: Compile source
        run: python -m compileall -q adhd tests
